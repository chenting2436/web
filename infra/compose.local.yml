services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-5432}:5432"
  keycloak:
    ports:
      - "127.0.0.1:${KEYCLOAK_LOCAL_PORT:-8180}:8080"
  openfga:
    ports:
      - "127.0.0.1:${OPENFGA_HTTP_LOCAL_PORT:-8081}:8080"
      - "127.0.0.1:${OPENFGA_GRPC_LOCAL_PORT:-8082}:8081"
  temporal:
    ports:
      - "127.0.0.1:${TEMPORAL_LOCAL_PORT:-7233}:7233"
  minio:
    ports:
      - "127.0.0.1:${MINIO_LOCAL_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_LOCAL_PORT:-9001}:9001"
  otel-collector:
    ports:
      - "127.0.0.1:${OTEL_GRPC_LOCAL_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_LOCAL_PORT:-4318}:4318"
