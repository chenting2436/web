      "get": {"operationId": "getCompatibilityHealth", "tags": ["health"], "summary": "Compatibility readiness probe", "description": "Alias of /ready, not a liveness probe. Both ready and not-ready results use the data envelope.", "security": [], "responses": {"200": {"$ref": "#/components/responses/Readiness"}, "503": {"$ref": "#/components/responses/Readiness"}}}
