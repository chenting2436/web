  "openapi": "3.1.0",
  "info": {
    "title": "SkyViewLab Go Control Plane API",
    "version": "1.0.0-gate-b",
    "description": "Machine-checkable contract for the current Go /api/v1 control plane. This contract describes the implemented Gate B boundary; it does not claim that every workbench domain schema or production NO-GO item is complete. All JSON success responses use {data, requestId}; all JSON failures use {error:{code,message}, message, requestId}."
  },
  "servers": [
    {"url": "https://api.example.com", "description": "Production placeholder; deployment supplies the real origin"},
    {"url": "http://127.0.0.1:8080", "description": "Local development"}
  ],
  "tags": [
    {"name": "health"}, {"name": "auth"}, {"name": "workbenches"},
    {"name": "projects"}, {"name": "jobs"}, {"name": "collaboration"},
    {"name": "tools"}, {"name": "audit"}, {"name": "internal-jobs"}
  ],
  "x-compatibility-aliases": {
    "/api": "Development-only temporary alias for /api/v1. It is not registered when DEV_MODE=false and is intentionally excluded from the stable contract and contract-code parity checks."
  },
  "x-size-limits": {
    "jsonRequestBytes": 4194304,
    "jobInputEncodedBytes": 1048576,
    "workbenchStateEncodedBytes": 1048576,
    "pythonUpstreamResponseBytes": 4194304,
    "generatedPublicResponseBytes": "not-currently-bounded",
    "notes": "The server rejects JSON request bodies above 4 MiB. Job input is additionally limited to 1 MiB after JSON encoding. The Python upstream response limit is an internal control-plane boundary, not a promise that public responses reach that size. Go-generated public responses do not yet have a separate byte cap; this is an explicit boundary, not an unlimited-size guarantee."
  },
  "x-origin-policy": "An unsafe request authenticated by skyviewlab_session must contain exactly one Origin value that exactly matches the configured CORS allowlist. Internal Worker Bearer requests do not require Origin.",
  "paths": {
