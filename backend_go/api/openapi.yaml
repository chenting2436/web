    "/api/v1/auth/oidc/start": {
      "get": {
        "operationId": "startOIDCLogin", "tags": ["auth"], "summary": "Start Authorization Code + PKCE login", "security": [],
        "description": "Sets an HttpOnly correlation cookie and redirects to the configured provider. Client-supplied return targets are ignored. Direct development traffic is bounded by a RemoteAddr network-prefix bucket and a process-global bucket. Production intentionally ignores untrusted Forwarded/X-Forwarded-For and applies only its process-global budget; the TLS gateway must enforce client-source limits before forwarding. The durable transaction store also records a non-consumable database-clock admission marker under its cross-replica creation lock, so callback or abort cannot reclaim the shared window allowance.",
        "responses": {"302": {"$ref": "#/components/responses/OIDCRedirect"}, "429": {"$ref": "#/components/responses/OIDCRateLimitError429"}, "502": {"$ref": "#/components/responses/Error502"}, "503": {"$ref": "#/components/responses/Error503"}}
      }
